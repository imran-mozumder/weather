<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Tomorrow Forecaster</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  background:#0b1220;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  text-align:center;
  color:#00d4ff;
}

.card{
  background:#111827;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:5px;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:none;
  border-radius:10px;
  background:#00d4ff;
  color:black;
  font-size:18px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:0.9;
}

.result{
  margin-top:20px;
  padding:20px;
  border-radius:10px;
  text-align:center;
  display:none;
}

.rain{
  background:#1e3a8a;
}

.clear{
  background:#065f46;
}

canvas{
  background:white;
  border-radius:10px;
  margin-top:20px;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>
<body>

<div class="container">

<h1>🌧️ Rain Tomorrow Forecaster</h1>

<div class="card">

<div class="grid">

<div>
<label>Humidity 9am</label>
<input type="number" id="Humidity9am" value="72">
</div>

<div>
<label>Humidity 3pm</label>
<input type="number" id="Humidity3pm" value="55">
</div>

<div>
<label>Pressure 9am</label>
<input type="number" id="Pressure9am" value="1015">
</div>

<div>
<label>Pressure 3pm</label>
<input type="number" id="Pressure3pm" value="1012">
</div>

<div>
<label>Rainfall Today</label>
<input type="number" id="Rainfall" value="0">
</div>

<div>
<label>Wind Gust Speed</label>
<input type="number" id="WindGustSpeed" value="40">
</div>

</div>

<button onclick="predictRain()">Run Prediction</button>

<div class="result" id="resultBox">
<h2 id="resultText"></h2>
<h3 id="probability"></h3>
</div>

</div>

<div class="card">
<h2>Model Comparison</h2>
<canvas id="chart"></canvas>
</div>

</div>

<script>

function getValue(id){
  return parseFloat(document.getElementById(id).value) || 0;
}

function predictRain(){

  let humidity9 = getValue("Humidity9am");
  let humidity3 = getValue("Humidity3pm");
  let pressure9 = getValue("Pressure9am");
  let pressure3 = getValue("Pressure3pm");
  let rainfall = getValue("Rainfall");
  let wind = getValue("WindGustSpeed");

  let score = 0;

  score += (humidity9 - 50) * 0.018;
  score += (humidity3 - 45) * 0.022;
  score += (1013 - pressure3) * 0.025;
  score += rainfall * 0.035;
  score += (wind - 35) * 0.008;

  let probability = 1 / (1 + Math.exp(-score));

  probability = Math.max(0.03, Math.min(0.97, probability));

  let percent = (probability * 100).toFixed(1);

  let willRain = probability >= 0.45;

  let box = document.getElementById("resultBox");
  let text = document.getElementById("resultText");
  let prob = document.getElementById("probability");

  box.style.display = "block";

  if(willRain){
    box.className = "result rain";
    text.innerHTML = "🌧️ Rain Expected Tomorrow";
  }else{
    box.className = "result clear";
    text.innerHTML = "☀️ No Rain Tomorrow";
  }

  prob.innerHTML = "Probability: " + percent + "%";
}

const ctx = document.getElementById('chart');

new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['Logistic Regression', 'Random Forest', 'XGBoost'],
    datasets: [{
      label: 'ROC-AUC',
      data: [0.861, 0.878, 0.875]
    }]
  },
  options: {
    responsive:true
  }
});

</script>

</body>
</html>
